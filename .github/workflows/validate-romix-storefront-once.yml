name: Validate ROMIX storefront once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-romix-storefront-once.yml'

permissions:
  contents: write

jobs:
  validate-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Start local storefront server
        shell: bash
        run: |
          sudo python3 -m http.server 80 --directory frontend/public >/tmp/romix-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://localhost/cart.html >/dev/null

      - name: Apply compatibility-safe fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          header = Path('frontend/public/assets/js/romix-header.js')
          text = header.read_text(encoding='utf-8')
          old = 'return window.innerWidth <= 768;'
          new = 'return window.innerWidth <= 900;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected mobile navigation breakpoint was not found')
          header.write_text(text, encoding='utf-8')

          cart_html = Path('frontend/public/cart.html')
          cart_html_text = cart_html.read_text(encoding='utf-8')
          alias = '    window.orderCartWhatsApp = handleOrder;\n'
          marker = '    function renderCart(){\n'
          if alias not in cart_html_text:
              if marker not in cart_html_text:
                  raise SystemExit('Expected renderCart marker was not found')
              cart_html_text = cart_html_text.replace(marker, alias + marker, 1)
          cart_html.write_text(cart_html_text, encoding='utf-8')

          cart_js = Path('frontend/public/assets/js/cart.js')
          cart_js_text = cart_js.read_text(encoding='utf-8')
          old_message = '''  const buildWhatsAppMessage = (cart = getCart()) => {
    if (!Array.isArray(cart) || !cart.length) return '';
    const lines = cart.map((item) => {
      const qty = Number(item.qty ?? item.quantity) || 0;
      const parts = [
        `- ${item.name || 'Producto'}`,
        item.color ? `Color: ${item.color}` : '',
        item.talle ? `Talle: ${item.talle}` : '',
        `Cant: ${qty}`,
      ].filter(Boolean);
      return parts.join(' | ');
    });
    return encodeURIComponent(lines.join('\\n'));
  };
'''
          new_message = '''  const decodeCartText = (value) => {
    if (value == null) return '';
    const text = String(value);
    try {
      return decodeURIComponent(text);
    } catch {
      return text;
    }
  };

  const buildWhatsAppMessage = (cart = getCart()) => {
    if (!Array.isArray(cart) || !cart.length) return '';
    let total = 0;
    const lines = cart.map((item) => {
      const qty = Number(item.qty ?? item.quantity) || 0;
      const price = Number(item.price) || 0;
      total += qty * price;
      const name = decodeCartText(item.name) || 'Producto';
      const type = decodeCartText(item.type);
      const color = decodeCartText(item.colorName ?? item.color);
      const size = decodeCartText(item.talle ?? item.size);
      const label = type ? `${name} (${type})` : name;
      const parts = [
        `- ${label}`,
        color ? `Color: ${color}` : '',
        size ? `Talle: ${size}` : '',
        `Cant: ${qty}`,
      ].filter(Boolean);
      return parts.join(' | ');
    });
    lines.push('', `Total: $${total.toFixed(2)}`);
    return encodeURIComponent(lines.join('\\n'));
  };
'''
          if old_message in cart_js_text:
              cart_js_text = cart_js_text.replace(old_message, new_message, 1)
          elif 'const decodeCartText = (value) =>' not in cart_js_text:
              raise SystemExit('Expected WhatsApp message builder was not found')
          cart_js.write_text(cart_js_text, encoding='utf-8')
          PY

      - name: JavaScript syntax checks
        run: |
          node --check frontend/public/assets/js/romix-header.js
          node --check frontend/public/assets/js/romix-minimal-theme.js
          node --check frontend/public/assets/js/romix-footer.js
          node --check frontend/public/assets/js/romix-catalog-pages.js
          node --check frontend/public/assets/js/cart.js
          node --check frontend/public/assets/js/products-store.js

      - name: Product validation
        run: npm run check:products

      - name: Storefront tests and accessibility checks
        run: npm test

      - name: Verify protected product data was not changed by redesign
        shell: bash
        run: |
          git diff --exit-code HEAD -- frontend/public/assets/data/products.json backend/data/product_variants.json || {
            echo 'Protected catalog/stock data changed unexpectedly.'
            exit 1
          }

      - name: Commit validated storefront fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/validate-romix-storefront-once.yml
          git add frontend/public/assets/js/romix-header.js frontend/public/assets/js/cart.js frontend/public/cart.html .github/workflows/validate-romix-storefront-once.yml
          git commit -m "fix: preserve cart contract and responsive navigation"
          git push
