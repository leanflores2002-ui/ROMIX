name: Sync mega menu with visible catalog once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-mega-menu-visible-catalog-once.yml'

permissions:
  contents: write

jobs:
  sync-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make mega menu catalog-aware
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/public/assets/js/romix-header.js';
          let source = fs.readFileSync(path, 'utf8');

          const marker = '  var MENU_CONFIG = buildMenuConfig();\n';
          if (!source.includes(marker)) throw new Error('MENU_CONFIG marker not found');
          if (source.includes('function syncMenuConfigWithProducts(')) throw new Error('Catalog-aware menu helpers already exist');

          const helpers = String.raw`

  function isCatalogProductVisible(product) {
    if (!product || typeof product !== "object") return false;

    if (Object.prototype.hasOwnProperty.call(product, "visible")) {
      if (typeof product.visible === "boolean") return product.visible;
      var visible = normalizeText(product.visible);
      return ["false", "0", "no", "hidden", "oculto", "inactive", "inactivo"].indexOf(visible) < 0;
    }

    if (product.hidden === true || product.hide === true || product.oculto === true) return false;

    if (Object.prototype.hasOwnProperty.call(product, "active")) {
      var active = normalizeText(product.active);
      if (["false", "0", "no"].indexOf(active) >= 0) return false;
    }

    var state = normalizeText(product.visibility || product.state || product.publish || "");
    if (["hidden", "oculto", "draft", "archived", "inactive", "inactivo"].indexOf(state) >= 0) return false;

    return true;
  }

  function loadMenuProducts() {
    if (window.romixProductsStore && typeof window.romixProductsStore.load === "function") {
      try {
        return Promise.resolve(window.romixProductsStore.load()).then(function (products) {
          return Array.isArray(products) ? products : [];
        });
      } catch (_error) {}
    }

    return fetch("assets/data/products.json", { cache: "default" })
      .then(function (response) {
        if (!response.ok) throw new Error("No se pudo cargar el catalogo para el menu");
        return response.json();
      })
      .then(function (products) {
        return Array.isArray(products) ? products : [];
      });
  }

  function productMenuText(product) {
    return normalizeText([
      product && product.name,
      product && product.type,
      product && product.season,
      product && product.featuredBadge,
      product && product.badge
    ].filter(Boolean).join(" "));
  }

  function hasMenuKeyword(products, keyword) {
    var needle = normalizeText(keyword);
    return products.some(function (product) {
      return productMenuText(product).indexOf(needle) >= 0;
    });
  }

  function seasonMenuLabel(value) {
    var key = normalizeText(value);
    if (key === "media-estacion" || key === "media estacion") return "Media estacion";
    if (key === "verano") return "Verano";
    if (key === "invierno") return "Invierno";
    return String(value || "Temporada");
  }

  function menuLink(label, href, icon, badge) {
    var link = { label: label, href: href };
    if (icon) link.icon = icon;
    if (badge) link.badge = badge;
    return link;
  }

  function pushIfVisible(target, products, definition, page) {
    var keywords = Array.isArray(definition.keywords) ? definition.keywords : [definition.keyword || definition.label];
    var matches = keywords.some(function (keyword) {
      return hasMenuKeyword(products, keyword);
    });
    if (!matches) return;

    var params = definition.params || {};
    target.push(menuLink(
      definition.label,
      buildHref(page, params),
      definition.icon || "circle",
      definition.badge || ""
    ));
  }

  function buildCatalogColumns(products, page) {
    var highlighted = [];
    var upper = [];
    var lower = [];
    var collections = [];

    var hasNew = products.some(function (product) {
      return normalizeText(product.featuredBadge || product.badge).indexOf("nuevo") >= 0;
    });
    var hasPopular = products.some(function (product) {
      return normalizeText(product.featuredBadge || product.badge).indexOf("mas vendido") >= 0;
    });
    var hasOffer = products.some(function (product) {
      return normalizeText(product.badge).indexOf("oferta") >= 0 || Number(product.originalPrice || 0) > Number(product.price || 0);
    });

    if (hasNew) highlighted.push(menuLink("Nuevos ingresos", buildHref(page, { q: "nuevo" }), "spark", "NEW"));
    if (hasPopular) highlighted.push(menuLink("Mas vendidos", buildHref(page, { q: "mas vendido" }), "trend", "HOT"));
    if (hasOffer) highlighted.push(menuLink("Ofertas", buildHref(page, { q: "oferta" }), "trend"));

    var seenSeasons = {};
    products.forEach(function (product) {
      var rawSeason = String(product.season || "").trim();
      var seasonKey = normalizeText(rawSeason);
      if (!seasonKey || seenSeasons[seasonKey]) return;
      seenSeasons[seasonKey] = true;
      highlighted.push(menuLink(
        seasonMenuLabel(rawSeason),
        buildHref(page, { temporada: rawSeason }),
        seasonKey === "verano" ? "spark" : "circle"
      ));
    });

    if (hasMenuKeyword(products, "lycra") || hasMenuKeyword(products, "saplex") || hasMenuKeyword(products, "dry")) {
      highlighted.push(menuLink("Looks deportivos", buildHref(page, { q_any: "lycra,saplex,dry,top,calza,ciclista" }), "move"));
    }

    [
      { label: "Remeras", keyword: "remera", params: { tipo: "remeras" }, icon: "top" },
      { label: "Tops", keyword: "top", params: { tipo: "tops" }, icon: "top" },
      { label: "Camperas", keyword: "campera", params: { tipo: "camperas" }, icon: "jacket" },
      { label: "Buzos", keyword: "buzo", params: { tipo: "buzos" }, icon: "top" },
      { label: "Musculosas", keyword: "musculosa", params: { q: "musculosa" }, icon: "top" },
      { label: "Camisolas", keyword: "camisola", params: { q: "camisola" }, icon: "top" },
      { label: "Sudaderas", keyword: "sudadera", params: { q: "sudadera" }, icon: "top" }
    ].forEach(function (definition) {
      pushIfVisible(upper, products, definition, page);
    });

    [
      { label: "Calzas", keyword: "calza", params: { tipo: "calzas" }, icon: "bottom" },
      { label: "Joggers", keyword: "jogger", params: { q: "jogger" }, icon: "bottom" },
      { label: "Babuchas", keyword: "babucha", params: { q: "babucha" }, icon: "bottom" },
      { label: "Rectos", keyword: "recto", params: { q: "recto" }, icon: "bottom" },
      { label: "Oxford", keyword: "oxford", params: { q: "oxford" }, icon: "bottom" },
      { label: "Palazos", keyword: "palazo", params: { q: "palazo" }, icon: "bottom" },
      { label: "Capri", keyword: "capri", params: { q: "capri" }, icon: "bottom" },
      { label: "Ciclistas", keyword: "ciclista", params: { q: "ciclista" }, icon: "bottom" },
      { label: "Shorts", keyword: "short", params: { q: "short" }, icon: "bottom" },
      { label: "Bermudas", keyword: "bermuda", params: { q: "bermuda" }, icon: "bottom" },
      { label: "Pollera short", keyword: "pollera", params: { q: "pollera" }, icon: "bottom" }
    ].forEach(function (definition) {
      pushIfVisible(lower, products, definition, page);
    });

    [
      { label: "Lycra", keywords: ["lycra"], params: { q: "lycra" } },
      { label: "Algodon", keywords: ["algodon"], params: { q: "algodon" } },
      { label: "Modal", keywords: ["modal"], params: { q: "modal" } },
      { label: "Morley", keywords: ["morley"], params: { q: "morley" } },
      { label: "Saplex", keywords: ["saplex"], params: { q: "saplex" } },
      { label: "Fibrana", keywords: ["fibrana"], params: { q: "fibrana" } },
      { label: "Dry Fit", keywords: ["dry fit", "dry"], params: { q: "dry" } },
      { label: "Rustico", keywords: ["rustico"], params: { q: "rustico" } },
      { label: "CEY", keywords: ["cey"], params: { q: "cey" } }
    ].forEach(function (definition) {
      pushIfVisible(collections, products, definition, page);
    });

    return [
      { title: "Destacados", links: highlighted.slice(0, 6) },
      { title: "Parte superior", links: upper.slice(0, 7) },
      { title: "Parte inferior", links: lower.slice(0, 8) },
      { title: "Colecciones", links: collections.slice(0, 7) }
    ].filter(function (column) {
      return column.links.length > 0;
    });
  }

  function buildCatalogAccessories(products, page) {
    var definitions = [
      { label: "Cuellos", keyword: "cuello" },
      { label: "Gorros", keyword: "gorro" },
      { label: "Guantes", keyword: "guante" },
      { label: "Medias", keyword: "media" },
      { label: "Mochilas", keyword: "mochila" },
      { label: "Botellas", keyword: "botella" },
      { label: "Cinturones", keyword: "cinturon" }
    ];
    var links = [];

    definitions.forEach(function (definition) {
      if (!hasMenuKeyword(products, definition.keyword)) return;
      links.push({
        label: definition.label,
        href: buildHref(page, { q: definition.keyword }),
        icon: "circle"
      });
    });

    if (!links.length) return null;
    return { title: "Accesorios", links: links };
  }

  function chooseMenuPromo(products, page, fallbackPromo) {
    var candidates = products.filter(function (product) {
      return product && product.image;
    });
    var product = candidates.find(function (candidate) {
      return candidate.featured === true || normalizeText(candidate.featuredBadge || candidate.badge) !== "";
    }) || candidates[0];

    if (!product) return fallbackPromo;

    var season = seasonMenuLabel(product.season || "");
    var badge = String(product.featuredBadge || product.badge || "").trim();
    return {
      eyebrow: badge || season,
      title: product.name || "Producto destacado ROMIX",
      description: season ? "Disponible en la coleccion actual de ROMIX." : "Producto disponible en ROMIX.",
      cta: "Ver producto",
      href: buildHref("product.html", { name: product.name || "" }),
      image: product.image,
      alt: (product.name || "Producto ROMIX") + " ROMIX"
    };
  }

  function syncMenuConfigWithProducts(products) {
    var visibleProducts = (Array.isArray(products) ? products : []).filter(isCatalogProductVisible);
    if (!visibleProducts.length) return;

    MENU_CONFIG.forEach(function (item) {
      if (["mujer", "hombre", "ninos"].indexOf(item.key) < 0) return;

      var sectionProducts = visibleProducts.filter(function (product) {
        return normalizeSection(product.section) === item.key;
      });
      if (!sectionProducts.length) return;

      item.columns = buildCatalogColumns(sectionProducts, item.page);
      item.promo = chooseMenuPromo(sectionProducts, item.page, item.promo);

      var accessories = buildCatalogAccessories(sectionProducts, item.page);
      if (accessories) {
        item.accessories = accessories;
      } else if (Object.prototype.hasOwnProperty.call(item, "accessories")) {
        item.accessories = null;
      }
    });
  }
`;

          source = source.replace(marker, marker + helpers);

          const initPattern = /  function init\(\) \{[\s\S]*?\n  \}\n\n  document\.addEventListener\("DOMContentLoaded", init\);/;
          const initReplacement = String.raw`  function renderHeader() {
    var current = getCurrentPage();
    var activeKey = getCurrentNavKey(current);
    var oldHeader = document.querySelector("header.site-header, header.romix-shared-header, header");
    var headerState = {
      closeSearch: function () {},
      closeMega: function () {}
    };

    var newHeader = document.createElement("header");
    newHeader.className = "site-header romix-shared-header";
    newHeader.innerHTML = buildHeaderTemplate(activeKey);

    if (oldHeader && oldHeader.parentNode) {
      oldHeader.replaceWith(newHeader);
    } else if (document.body) {
      document.body.insertAdjacentElement("afterbegin", newHeader);
    }

    bindSearchToggle(headerState);
    bindMegaMenu(newHeader, headerState);
    bindMobileMenu(newHeader, headerState);
    bindMobileAutoHide(newHeader);
    bindHeaderFavorites();
    updateCartBadge();
    window.addEventListener("storage", updateCartBadge);
    ensureSearchScript().then(function (autoloaded) {
      dispatchHeaderReady({ rebuilt: true, page: current, activeKey: activeKey, searchAutoloaded: !!autoloaded });
    });
  }

  function init() {
    loadMenuProducts()
      .then(function (products) {
        syncMenuConfigWithProducts(products);
      })
      .catch(function (error) {
        console.warn("ROMIX: no se pudo sincronizar el mega menu con el catalogo visible.", error);
      })
      .then(renderHeader);
  }

  document.addEventListener("DOMContentLoaded", init);`;

          if (!initPattern.test(source)) throw new Error('init block not found');
          source = source.replace(initPattern, initReplacement);

          fs.writeFileSync(path, source, 'utf8');
          NODE

      - name: Validate JavaScript syntax
        run: node --check frontend/public/assets/js/romix-header.js

      - name: Validate product catalog
        run: npm run check:products

      - name: Commit catalog-aware menu
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/sync-mega-menu-visible-catalog-once.yml
          git add frontend/public/assets/js/romix-header.js .github/workflows/sync-mega-menu-visible-catalog-once.yml
          git commit -m "feat: sync mega menu with visible catalog"
          git push