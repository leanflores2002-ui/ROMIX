<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; font-src 'self' https: data:; script-src 'self' https://cdnjs.cloudflare.com 'nonce-r0mix2025'; connect-src 'self'; upgrade-insecure-requests" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root { --primary:#e83e8c; --secondary:#6f42c1; --light:#f8f9fa; --dark:#343a40; --success:#28a745; --danger:#dc3545; --radius:12px; }
    *{ box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body{ margin:0; background:#fff1f6; color:#1b1f24; }
    header{ background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; padding:16px 0; position:sticky; top:0; z-index:1000; box-shadow:0 6px 16px rgba(0,0,0,.12); }
    .header-container{ max-width:1200px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .logo{ font-size:1.6rem; font-weight:800; display:flex; align-items:center; gap:8px; }
    .global-search{ display:flex; align-items:center; gap:8px; position:relative; }
    .global-search input[type="search"]{ padding:10px 14px; border:1px solid rgba(0,0,0,.15); background:#fff; color:#1b1f24; border-radius:999px; min-width:260px; outline:none; }
    .global-search input::placeholder{ color:#6c757d; opacity:.9; }
    .global-search button{ padding:8px 14px; border-radius:999px; border:1px solid rgba(0,0,0,.15); background:#fff; color:var(--primary); cursor:pointer; font-weight:700; }
    .search-suggestions{ position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #ddd; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.12); padding:6px 0; z-index:2001; color:#212529; }
    .search-suggestion{ display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; color:#212529; }
    .search-suggestion .t{ color:#212529; }
    .search-suggestion .t strong{ color:#212529; }
    .search-suggestion small{ color:#6c757d; }
    .cart-icon-btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 12px; border-radius:20px; border:1px solid rgba(255,255,255,.45); background: rgba(0,0,0,.1); color:#fff; cursor:pointer; }
    #cart-count { background: var(--danger); color:#fff; border-radius:999px; padding:0 6px; font-size:.8rem; position:absolute; top:-8px; right:-8px; min-width:18px; text-align:center; }

    .container{ max-width:1200px; margin:20px auto; padding:0 20px; }
    .page-title{ font-size:2rem; color:#6f42c1; font-weight:900; margin:10px 0 14px; }
    .products-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:18px; }
    .product-card{ background:#fff; border-radius:14px; box-shadow:0 12px 28px rgba(0,0,0,.08); overflow:hidden; transition: transform .25s ease, box-shadow .25s ease; position:relative; }
    .product-card:hover{ transform: translateY(-4px); box-shadow:0 18px 40px rgba(111,66,193,.18); }
    .product-image{ height:240px; background:#f5f6f9; display:flex; align-items:center; justify-content:center; position:relative; }
    .product-image img{ max-width:90%; max-height:90%; object-fit:contain; }
    .product-badge{ position:absolute; top:10px; right:10px; background:var(--primary); color:#fff; padding:6px 10px; border-radius:999px; font-weight:800; font-size:.78rem; }
    .product-info{ padding:14px; }
    .product-title{ font-weight:800; color:#1b1f24; height:48px; overflow:hidden; cursor:pointer; }
    .product-price{ color:#e83e8c; font-size:1.25rem; font-weight:900; }
    .product-price small{ color:#6c757d; text-decoration:line-through; margin-left:6px; }
    .product-colors,.size-options{ display:flex; flex-wrap:wrap; gap:6px; }
    .color-option{ width:22px; height:22px; border-radius:50%; border:1px solid #ddd; cursor:pointer; }
    .color-option.selected{ box-shadow: 0 0 0 2px var(--primary); }
    .size-chip{ padding:6px 10px; border:1px solid #ddd; border-radius:10px; font-weight:700; cursor:pointer; }
    .size-chip[data-state="out"]{ opacity:.5; text-decoration:line-through; cursor:not-allowed; }
    .size-chip.selected{ outline:2px solid #343a40; }
    .quantity-control{ display:flex; align-items:center; gap:8px; margin-top:8px; }
    .quantity-input{ width:70px; text-align:center; padding:6px; border:1px solid #ddd; border-radius:8px; }
    .btn{ padding:10px 14px; border-radius:10px; border:1px solid #eee; background:#fff; cursor:pointer; font-weight:800; }
    .btn-primary{ background:linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border:none; }
    .skip-link{ position:absolute; left:-9999px; top:auto; }
    .skip-link:focus{ left:12px; top:12px; z-index:9999; background:#fff; color:#000; padding:8px 10px; border-radius:8px }
  </style>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="header-container">
      <div class="logo" aria-label="Romix"><i class="fas fa-tshirt" aria-hidden="true"></i><span>ROMIX</span></div>
      <button type="button" class="cart-icon-btn" onclick="window.location.href='index.html#cart'" aria-label="Ir al carrito">
        <i class="fas fa-shopping-cart" aria-hidden="true"></i>
        <span id="cart-count">0</span>
      </button>
      <form id="global-search-form" class="global-search" role="search" aria-label="Buscar productos">
        <input type="search" name="q" placeholder="Buscar producto..." aria-label="Buscar producto" />
        <button type="submit"><i class="fas fa-search" aria-hidden="true"></i> Buscar</button>
      </form>
    </div>
  </header>

  <main class="container" id="contenido">
    <h1 class="page-title"><i class="fas fa-female" aria-hidden="true"></i> Mujer</h1>
    <div id="grid" class="products-grid" aria-live="polite"></div>
  </main>

  <script nonce="r0mix2025">
    function esc(s){ const m={"&":"&amp;","<":"&lt;",
      ">":"&gt;","\"":"&quot;","'":"&#39;"}; return String(s).replace(/[&<>"']/g, ch=>m[ch]); }
    function slugify(s){ try { return String(s||'').normalize('NFD').replace(/\p{Diacritic}+/gu,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); } catch { return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-'); } }
    function updateCartCount(){ try { const c=(JSON.parse(localStorage.getItem('cart')||'[]').reduce((n,i)=>n+Number(i.quantity||0),0)); const el=document.getElementById('cart-count'); if(el) el.textContent=String(c); } catch{} }

    const SIZE_GROUP_PRICING = { common: 1.0, special: 1.15, superspecial: 1.15 };
    function getUnitPrice(product, size){
      const base = Number(product.price)||0; const sz = Number(size);
      if (!isNaN(sz)){
        if (product.priceBySize && product.priceBySize[String(sz)]!=null) return Number(product.priceBySize[String(sz)]);
        const resolveGroup = (szNum)=>{
          let isSuper=false, isSpecial=false;
          if (Array.isArray(product.superSpecialSizes)) isSuper = product.superSpecialSizes.map(Number).includes(szNum);
          else if (product.groupSuperMin) isSuper = szNum >= Number(product.groupSuperMin);
          else isSuper = szNum >= 9;
          if (!isSuper){
            if (Array.isArray(product.specialSizes)) isSpecial = product.specialSizes.map(Number).includes(szNum);
            else if (product.groupSpecialMin) isSpecial = szNum >= Number(product.groupSpecialMin);
            else isSpecial = szNum >= 6;
          }
          return isSuper ? 'superspecial' : (isSpecial ? 'special' : 'common');
        };
        const group = resolveGroup(sz);
        if (product.priceByGroup && product.priceByGroup[group]!=null) return Number(product.priceByGroup[group]);
        const mult = SIZE_GROUP_PRICING[group] || 1;
        return Math.round(base * mult * 100) / 100;
      }
      return base;
    }

    function normalizeStockByColor(product){
      if (product && product.stockByColor) return product.stockByColor;
      const map = {};
      const defaultSizes = (product.sizes || []).reduce((acc, s) => {
        const status = String(s.status || '').toLowerCase();
        let qty = 5; if (status.includes('unavail')) qty=0; else if (status.includes('low')) qty=2; acc[String(s.size)] = qty; return acc;
      }, {});
      (product.colors || []).forEach(c => { map[c.name] = { ...defaultSizes } });
      if (!product.colors || !product.colors.length) map['Unico'] = { ...defaultSizes };
      return map;
    }
    function stateFromStock(n){ if (n<=0) return 'out'; if (n<=3) return 'low'; return 'available'; }
    function labelFromState(st){ if(st==='out') return 'AGOTADO'; if(st==='low') return 'Por agotarse'; return 'Disponible'; }
    function computeTotalStock(product){ if(product && product.stockByColor){ let t=0; for(const c of Object.keys(product.stockByColor)){ const m=product.stockByColor[c]||{}; for(const k of Object.keys(m)) t+=Number(m[k]||0);} return t;} const statuses=(product.sizes||[]).map(s=>String(s.status||'').toLowerCase()); return statuses.reduce((sum,st)=> st.includes('unavail')?sum:(st.includes('low')?sum+2:sum+5),0); }
    function setBuyEnabled(card, enabled){ const btn=card.querySelector('.btn.btn-primary'); if(!btn) return; btn.disabled=!enabled; btn.setAttribute('aria-disabled', enabled?'false':'true'); }
    function getSelectedSize(card){ return card.dataset.selectedSize || card.querySelector('.size-chip.selected')?.dataset.size || null; }
    function updateCardPrice(card, product){ const size=getSelectedSize(card); const priceBox=card.querySelector('.product-price'); const unit=size?getUnitPrice(product,size):Number(product.price)||0; priceBox.textContent=`$${Number(unit).toLocaleString('es-AR')}`; if(product.originalPrice){ const s=document.createElement('small'); s.textContent=`$${Number(product.originalPrice).toLocaleString('es-AR')}`; priceBox.append(' '); priceBox.appendChild(s);} }

    function renderSizesForColor(card, product, colorName){
      const sizeWrap = card.querySelector('.size-options'); if(!sizeWrap) return;
      const stockByColor = normalizeStockByColor(product); const stockMap = stockByColor[colorName] || {};
      const allSizes = (()=>{ const raw=(product.sizes||[]).map(s=>String(s.size)); const seen=new Set(); const uniq=[]; for(const sz of raw){ if(!seen.has(sz)){ seen.add(sz); uniq.push(sz);} } return uniq; })();
      const toRender=(allSizes.length?allSizes:Object.keys(stockMap)).sort((a,b)=>Number(a)-Number(b));
      sizeWrap.innerHTML = toRender.map(sz=>{ const st=Number(stockMap[String(sz)]??0); const state=stateFromStock(st); return `<span class="size-chip" data-state="${state}" role="button" tabindex="0" data-size="${sz}">${sz}</span>`; }).join('');
      sizeWrap.querySelectorAll('.size-chip').forEach(el=>{ const handle=()=>{ if(el.dataset.state==='out') return; sizeWrap.querySelectorAll('.size-chip').forEach(s=>s.classList.remove('selected')); el.classList.add('selected'); card.dataset.selectedSize=el.dataset.size; updateCardPrice(card,product); setBuyEnabled(card,true); }; el.addEventListener('click',handle); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handle(); } }); });
      setBuyEnabled(card,false); updateCardPrice(card,product);
    }

    function render(products){
      const grid=document.getElementById('grid'); if(!grid) return; grid.innerHTML='';
      products.filter(p=>String(p.section||'').toLowerCase()==='mujer').forEach(product=>{
        const card = document.createElement('div'); card.className='product-card'; card.dataset.product = JSON.stringify(product);
        const colorsHTML = (product.colors||[]).map(color=>{ const border=color.hex==='#ffffff'?'border:1px solid #ddd;':''; return `<div class="color-option" role="button" tabindex="0" aria-label="Color ${esc(color.name)}" style="background-color:${color.hex};${border}" title="${esc(color.name)}" data-color="${esc(color.name)}"></div>`; }).join('');
        const sizesHTML = (product.sizes||[]).map(s=>{ const unavailable=s.status==='unavailable'; return `<span class="size-chip ${s.status}" role="button" ${unavailable?'aria-disabled="true"':''} tabindex="0" data-size="${s.size}">${s.size}</span>`; }).join('');
        const priceHTML = `$${Number(product.price||0).toLocaleString('es-AR')}` + (product.originalPrice?` <small>$${Number(product.originalPrice).toLocaleString('es-AR')}</small>`:'');
        card.innerHTML = `
          <div class="product-image">
            <img src="${product.image||'images/placeholder.jpg'}" onerror="this.onerror=null; this.src='images/placeholder.jpg';" alt="${esc(product.name)}" loading="lazy" width="800" height="800" />
            ${product.badge?`<span class="product-badge">${esc(product.badge)}</span>`:''}
          </div>
          <div class="product-info">
            <h3 class="product-title">${esc(product.name)}</h3>
            <div class="product-price">${priceHTML}</div>
            <div class="product-colors">${colorsHTML}</div>
            <div class="product-sizes">
              <div class="size-title" style="color:#6c757d">Talles disponibles:</div>
              <div class="size-options">${sizesHTML}</div>
            </div>
            <div class="quantity-control">
              <span class="quantity-title">Cantidad:</span>
              <button class="btn quantity-btn decrease" type="button" aria-label="Disminuir cantidad">-</button>
              <input type="number" class="quantity-input" min="1" value="1" inputmode="numeric" />
              <button class="btn quantity-btn increase" type="button" aria-label="Aumentar cantidad">+</button>
            </div>
            <div class="product-selection-status" aria-live="polite" style="color:#6c757d">Sin selección</div>
            <div class="product-stock-note" aria-label="Stock total disponible" style="font-size:.8rem;color:#6c757d;margin-top:2px;"></div>
            <div class="product-actions">
              <button class="btn btn-primary" type="button" aria-disabled="true" disabled>Comprar</button>
            </div>
          </div>`;

        // Stock total note
        const stockNote=card.querySelector('.product-stock-note'); if (stockNote){ const total=computeTotalStock(product); const label= total===1?'1 unidad':(total+' unidades'); stockNote.textContent='Stock total: '+label; }

        // Color select
        card.querySelectorAll('.color-option').forEach(el=>{ el.addEventListener('click',()=>{ card.querySelectorAll('.color-option').forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); card.dataset.selectedColor=el.dataset.color; const key=el.dataset.color; let imgUrl=product.image; if(product.images){ imgUrl = product.images[key] || imgUrl; } const imgEl=card.querySelector('.product-image img'); if(imgEl) imgEl.src = imgUrl; renderSizesForColor(card, product, el.dataset.color); }); el.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } }); });

        // Inicial selections
        if (product.colors && product.colors.length){ const first = card.querySelector('.color-option'); if(first){ first.classList.add('selected'); card.dataset.selectedColor = first.dataset.color; renderSizesForColor(card, product, first.dataset.color); } }
        else { renderSizesForColor(card, product, 'Unico'); }

        // Qty controls
        const dec=card.querySelector('.decrease'); const inc=card.querySelector('.increase'); const input=card.querySelector('.quantity-input');
        dec.addEventListener('click',()=>{ const v=parseInt(input.value)||1; if(v>1) input.value=v-1; });
        inc.addEventListener('click',()=>{ const v=parseInt(input.value)||1; input.value=v+1; });
        input.addEventListener('input',()=>{ let v=parseInt(input.value); if(isNaN(v)||v<1) input.value=1; });

        // Comprar -> agrega al carrito
        card.querySelector('.btn.btn-primary').addEventListener('click', (e)=>{
          if (e.currentTarget.getAttribute('aria-disabled')==='true'){ e.preventDefault(); return; }
          const color = card.dataset.selectedColor || (product.colors?.[0]?.name) || 'Unico';
          const size = getSelectedSize(card);
          const qty = Math.max(1, parseInt(card.querySelector('.quantity-input').value)||1);
          const unit = getUnitPrice(product, size);
          const subtotal = unit * qty;
          const item = { id: Date.now(), name: product.name, type: product.type, color, size, quantity: qty, price: unit, subtotal };
          let cart=[]; try { cart = JSON.parse(localStorage.getItem('cart')||'[]'); } catch{}
          cart.push(item); localStorage.setItem('cart', JSON.stringify(cart)); updateCartCount(); alert('Producto agregado al carrito');
        });

        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      updateCartCount();
      fetch('products.json').then(r=>r.json()).then(render).catch(()=>render([]));
    });
  </script>
  <script src="support-widget-romix.js" defer></script>
  <script src="search.js"></script>
</body>
</html>
