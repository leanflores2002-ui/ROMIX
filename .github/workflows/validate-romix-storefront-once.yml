name: Validate ROMIX storefront once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-romix-storefront-once.yml'
      - '.github/scripts/finalize_storefront.py'

permissions:
  contents: write

jobs:
  validate-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Apply final storefront fixes
        run: python3 .github/scripts/finalize_storefront.py

      - name: Start local storefront server
        shell: bash
        run: |
          sudo python3 -m http.server 80 --directory frontend/public >/tmp/romix-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://localhost/cart.html >/dev/null

      - name: JavaScript syntax checks
        run: |
          node --check frontend/public/assets/js/romix-header.js
          node --check frontend/public/assets/js/romix-minimal-theme.js
          node --check frontend/public/assets/js/romix-footer.js
          node --check frontend/public/assets/js/romix-catalog-pages.js
          node --check frontend/public/assets/js/cart.js
          node --check frontend/public/assets/js/products-store.js

      - name: Product validation
        run: npm run check:products

      - name: Storefront tests and accessibility checks
        run: npm test

      - name: Verify protected product data was not changed
        run: git diff --exit-code HEAD -- frontend/public/assets/data/products.json backend/data/product_variants.json

      - name: Commit validated storefront fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/validate-romix-storefront-once.yml .github/scripts/finalize_storefront.py
          git add frontend/public/assets/js/romix-header.js frontend/public/assets/js/cart.js frontend/public/cart.html .github/workflows/validate-romix-storefront-once.yml .github/scripts/finalize_storefront.py
          git commit -m "fix: preserve cart contract and responsive navigation"
          git push
