<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROMIX - Catálogo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <style>
    :root { --primary:#e83e8c; --secondary:#6f42c1; --success:#28a745; --danger:#dc3545; --light:#f8f9fa; --dark:#1b1f24; }
    * { box-sizing: border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin:0; background:#fff1f6; color:#232323; }
    header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; padding:14px 0; box-shadow:0 4px 14px rgba(0,0,0,.12); position: sticky; top: 0; z-index: 1000; }
    .header-container { max-width: 1200px; margin:0 auto; padding:0 20px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; }
    .logo { font-size:1.6rem; font-weight:900; display:flex; align-items:center; gap:8px; text-decoration:none; color:#fff; }
    .cart-icon-btn { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.5); color:#fff; padding:8px 12px; border-radius:999px; cursor:pointer; text-decoration:none; }
    #cart-count { background: var(--danger); color:#fff; border-radius:999px; padding:0 6px; font-size:.8rem; }

    .container { max-width:1200px; margin:18px auto; padding:0 20px; }
    .section-title { font-size:1.4rem; font-weight:900; margin:6px 0 8px; }
    /* Tabs */
    .catalog-tabs { display:flex; gap:10px; margin: 8px 2px 10px; flex-wrap:wrap; }
    .catalog-tab { padding:8px 14px; border-radius:999px; border:1px solid #e9ecef; background:#fff; color:#6f42c1; font-weight:800; cursor:pointer; }
    .catalog-tab.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border-color: transparent; }
    /* Toolbar */
    .catalog-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin: 6px 2px 10px; }
    .catalog-toolbar input[type="search"] { padding:8px 10px; border:1px solid #dee2e6; border-radius:8px; min-width:220px; }
    .catalog-toolbar select { padding:8px 10px; border:1px solid #dee2e6; border-radius:8px; }
    .catalog-toolbar .count { color:#6c757d; font-weight:600; }

    .products-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }
    .product-card { background:#fff; border-radius:14px; box-shadow:0 14px 36px rgba(0,0,0,.10); overflow:hidden; display:flex; flex-direction:column; }
    .product-image { position:relative; height:200px; background:#f8f9fb; display:flex; align-items:center; justify-content:center; }
    .product-image img { max-width:100%; max-height:100%; object-fit:contain; }
    .product-badge { position:absolute; top:10px; right:10px; background:#f1f3f5; color:#6c757d; border-radius:999px; padding:6px 10px; font-size:.8rem; font-weight:800; box-shadow:0 6px 16px rgba(0,0,0,.12); }
    .product-info { padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
    .product-title { font-size:1.05rem; font-weight:900; color:#111; cursor:pointer; }
    .product-subtitle { color:#6c757d; font-size:.95rem; }
    .product-price { color: var(--primary); font-weight:900; font-size:1.2rem; }
    .product-stock-note { text-align:right; font-weight:800; font-size:.9rem; }
    .product-stock-note.state-available { color: var(--success); }
    .product-stock-note.state-low { color: #ff9800; }
    .product-stock-note.state-out { color: var(--danger); }
    .product-actions { display:flex; gap:10px; }
    .btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 12px; border-radius:10px; border:1px solid #e9ecef; cursor:pointer; font-weight:800; text-decoration:none; }
    .btn-details { background:#fff; color:#495057; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border:none; }
    /* Ayuda visible */
    .help-banner { display:flex; align-items:center; gap:12px; background: linear-gradient(135deg, #fff, #ffe2f2); border:1px solid #ffd1ea; border-radius:12px; padding:12px 14px; box-shadow:0 10px 24px rgba(232,62,140,.08); margin: 10px 0 16px; }
    .help-banner i { color:#e83e8c; font-size:22px; }
    .help-banner a { color:#6f42c1; font-weight:800; text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo"><i class="fas fa-store" aria-hidden="true"></i> ROMIX</a>
      <span></span>
      <a class="cart-icon-btn" href="cart.html" aria-label="Ir al carrito"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a>
    </div>
  </header>
  <div class="container">
    <div class="catalog-tabs" role="tablist" aria-label="Categorías">
      <button class="catalog-tab active" role="tab" aria-selected="true" data-section="mujer">Mujer</button>
      <button class="catalog-tab" role="tab" aria-selected="false" data-section="hombre">Hombre</button>
      <button class="catalog-tab" role="tab" aria-selected="false" data-section="ninos">Niños</button>
    </div>
    <h1 id="catalog-title" class="section-title">Colección Mujer</h1>
    <section id="ayuda" class="help-banner" aria-label="Ayuda">
      <i class="fas fa-info-circle" aria-hidden="true"></i>
      <div>
        <strong>¿Necesitás ayuda?</strong> Revisá colores, talles y stock desde el detalle o escribinos por <a href="https://wa.me/5491154272065" target="_blank" rel="noopener">WhatsApp</a>. También podés ver la <a href="ayuda.html">guía de ayuda</a>.
      </div>
    </section>
    <div class="catalog-toolbar">
      <input id="cat-q" type="search" placeholder="Buscar producto..." aria-label="Buscar producto" />
      <label style="display:inline-flex; align-items:center; gap:6px; color:#6c757d;">Ordenar:
        <select id="cat-order"><option value="relevancia">Relevancia</option></select>
      </label>
      <span id="cat-count" class="count">Mostrando 0 de 0 productos</span>
    </div>
    <div class="products-grid" id="catalog-grid"></div>
    <div id="catalog-empty" class="no-results hidden" style="margin-top:10px;"><i class="fas fa-info-circle"></i> <span class="tip">Sin resultados en esta categoría.</span></div>
  </div>
  <script>
    function safeGetCart(){ try { return JSON.parse(localStorage.getItem('cart'))||[]; } catch { return []; } }
    function updateCartBadge(){ try { const n=(safeGetCart()||[]).reduce((t,i)=>t+(Number(i.quantity)||0),0); const el=document.getElementById('cart-count'); if(el) el.textContent=String(n); } catch{} }
    function fixText(s){ if(!s||typeof s!=='string') return s; const m=[['CatÃ¡logo','Catálogo'],['MÃ¡s','Más'],['NiÃ±os','Niños'],['ColecciÃ³n','Colección']]; let o=s; m.forEach(([a,b])=>o=o.split(a).join(b)); return o; }
    function fixAll(){ try{ const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null); const ns=[]; while(w.nextNode()) ns.push(w.currentNode); ns.forEach(n=> n.nodeValue=fixText(n.nodeValue)); }catch{} }
    document.addEventListener('DOMContentLoaded', ()=>{ updateCartBadge(); fixAll(); });
  </script>
  <script src="catalog-tabs.js"></script>
</body>
</html>
