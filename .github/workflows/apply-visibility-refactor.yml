name: Apply product visibility refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-visibility-refactor.py'
      - '.github/workflows/apply-visibility-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python scripts/apply-visibility-refactor.py

      - name: Validate syntax
        run: |
          node --check frontend/public/assets/js/products-store.js
          node --check frontend/public/assets/js/romix-catalog-pages.js
          python -m py_compile backend/app/main.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/assets/js/products-store.js \
                  frontend/public/assets/js/romix-catalog-pages.js \
                  frontend/public/product.html \
                  backend/app/main.py \
                  docs/CATALOGO_PRODUCTOS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: control product visibility explicitly"
          git push
