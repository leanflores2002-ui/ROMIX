name: Apply ROMIX minimal storefront once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-romix-minimal-storefront-once.yml'

permissions:
  contents: write

jobs:
  apply-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global visual layer to public pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('frontend/public')
          pages = [
              'index.html',
              'catalogo.html',
              'mujer.html',
              'hombre.html',
              'ninos.html',
              'novedades.html',
              'product.html',
              'cart.html',
              'ayuda.html',
              'detalle.html',
              '404.html',
          ]

          css_tag = '  <link rel="stylesheet" href="assets/css/romix-minimal-theme.css" />'
          js_tag = '  <script src="assets/js/romix-minimal-theme.js" defer></script>'

          for name in pages:
              path = root / name
              if not path.exists():
                  raise SystemExit(f'Missing required page: {path}')
              text = path.read_text(encoding='utf-8-sig')

              # The storefront no longer depends on Font Awesome. Keep Google Fonts.
              text = re.sub(
                  r'\s*<link[^>]+href=["\'][^"\']*(?:font-awesome|fontawesome)[^"\']*["\'][^>]*>\s*',
                  '\n',
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  r'\s*<noscript>\s*<link[^>]+href=["\'][^"\']*(?:font-awesome|fontawesome)[^"\']*["\'][^>]*>\s*</noscript>\s*',
                  '\n',
                  text,
                  flags=re.I,
              )

              if 'assets/css/romix-minimal-theme.css' not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'No closing head in {name}')
                  text = text.replace('</head>', css_tag + '\n</head>', 1)

              if 'assets/js/romix-minimal-theme.js' not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'No closing body in {name}')
                  text = text.replace('</body>', js_tag + '\n</body>', 1)

              path.write_text(text, encoding='utf-8')

          # Replace the redirecting 404 with a real, accessible page.
          not_found = root / '404.html'
          not_found.write_text('''<!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta name="robots" content="noindex" />
            <title>ROMIX - Página no encontrada</title>
            <link rel="icon" href="images/logo-romix-icon-64.png" type="image/png" sizes="64x64" />
            <link rel="apple-touch-icon" href="images/logo-romix-icon-180.png" />
            <link rel="stylesheet" href="assets/css/romix-minimal-theme.css" />
            <style>
              .not-found-page { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: #fff; }
              .not-found-card { width: min(100%, 560px); text-align: center; display: grid; justify-items: center; gap: 16px; }
              .not-found-icon { font-size: clamp(3rem, 10vw, 5rem); line-height: 1; }
              .not-found-card h1 { margin: 0; color: #242426; font-family: "Outfit", "Manrope", sans-serif; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; letter-spacing: -.035em; }
              .not-found-card p { margin: 0; max-width: 42ch; color: #66666b; }
              .not-found-card a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0 20px; border-radius: 10px; background: #F22797; color: #fff; font-weight: 800; text-decoration: none; }
            </style>
          </head>
          <body>
            <main class="not-found-page">
              <section class="not-found-card" aria-labelledby="not-found-title">
                <span class="not-found-icon" aria-hidden="true">😕</span>
                <h1 id="not-found-title">No encontramos esta página.</h1>
                <p>La dirección puede haber cambiado o ya no estar disponible.</p>
                <a href="index.html"><span aria-hidden="true">🏠</span>&nbsp; Volver al inicio</a>
              </section>
            </main>
            <script src="assets/js/romix-minimal-theme.js" defer></script>
          </body>
          </html>
          ''', encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/public/assets/js/romix-minimal-theme.js
          node --check frontend/public/assets/js/romix-header.js
          node --check frontend/public/assets/js/romix-footer.js
          node --check frontend/public/assets/js/romix-catalog-pages.js
          node --check frontend/public/assets/js/cart.js
          node --check frontend/public/assets/js/products-store.js

      - name: Validate product catalog
        run: npm run check:products

      - name: Verify theme coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ['index.html','catalogo.html','mujer.html','hombre.html','ninos.html','novedades.html','product.html','cart.html','ayuda.html','detalle.html','404.html']
          for page in pages:
              text = (Path('frontend/public') / page).read_text(encoding='utf-8')
              assert 'assets/css/romix-minimal-theme.css' in text, page
              assert 'assets/js/romix-minimal-theme.js' in text, page
              assert 'font-awesome' not in text.lower(), page
              assert 'fontawesome' not in text.lower(), page
          print('Theme coverage OK:', len(pages), 'pages')
          PY

      - name: Commit storefront rollout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-romix-minimal-storefront-once.yml
          git add frontend/public/index.html frontend/public/catalogo.html frontend/public/mujer.html frontend/public/hombre.html frontend/public/ninos.html frontend/public/novedades.html frontend/public/product.html frontend/public/cart.html frontend/public/ayuda.html frontend/public/detalle.html frontend/public/404.html .github/workflows/apply-romix-minimal-storefront-once.yml
          git commit -m "feat: apply minimal accessible storefront theme"
          git push
