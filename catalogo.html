<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROMIX - Catálogo</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; script-src 'self' https://cdnjs.cloudflare.com; connect-src 'self'; upgrade-insecure-requests">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" integrity="sha512-b7ZPnUPQK1G3z2d4l0f7Gm2M1eJp4z8f5s1p9o3r2x6z0kYd8l9r4Qv5B1c2D3E4F5G6H7I8J9K0L1M2N3O4PQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root { --primary:#e83e8c; --secondary:#6f42c1; --success:#28a745; --danger:#dc3545; --light:#f8f9fa; --dark:#1b1f24; }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin:0; background:#fff1f6; color:#232323; }
    header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; padding:14px 0; box-shadow:0 4px 14px rgba(0,0,0,.12); position: sticky; top:0; z-index: 1000; }
    .header-wrap { max-width:1200px; margin:0 auto; padding:0 20px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; }
    .logo { font-size:1.4rem; font-weight:900; display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; }
    nav ul { list-style:none; display:flex; gap:16px; padding:0; margin:0; }
    nav a { color:#fff; text-decoration:none; padding:8px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); }
    nav a[aria-current="page"] { background:rgba(255,255,255,.22); }
    header nav { justify-self:center; }
    .cart-btn { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.5); color:#fff; padding:8px 12px; border-radius:999px; cursor:pointer; }
    .cart-count { background: var(--danger); color:#fff; border-radius:999px; padding:0 6px; font-size:.8rem; }

    .container { max-width:1200px; margin:18px auto; padding:0 20px; }
    .summary { color:#6c757d; margin: 6px 2px 12px; font-weight:600; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .toolbar input[type="search"]{ padding:8px 10px; border:1px solid #dee2e6; border-radius:8px; min-width:220px; color:#212529; background:#fff; caret-color: var(--secondary); }
    .toolbar input[type="search"]::placeholder{ color:#6c757d; }
    .toolbar select{ padding:8px 10px; border:1px solid #dee2e6; border-radius:8px; }

    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }
    .card { background:#fff; border-radius:14px; box-shadow:0 14px 36px rgba(0,0,0,.10); overflow:hidden; display:flex; flex-direction:column; }
    .thumb { position:relative; height:200px; background:#f8f9fb; display:flex; align-items:center; justify-content:center; }
    .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
    .badge { position:absolute; top:10px; right:10px; background:#f1f3f5; color:#6c757d; border-radius:999px; padding:6px 10px; font-size:.8rem; font-weight:800; box-shadow:0 6px 16px rgba(0,0,0,.12); }
    .body { padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
    .title { font-size:1.05rem; font-weight:900; color:#111; }
    .subtitle { color:#6c757d; font-size:.95rem; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .price { color: var(--primary); font-weight:900; font-size:1.2rem; }
    .stock { color: var(--success); font-weight:800; font-size:.9rem; text-align:right; }
    .stock small { display:block; color:#6c757d; font-weight:600; }
    .actions { display:flex; gap:10px; margin-top:4px; }
    .btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 12px; border-radius:10px; border:1px solid #e9ecef; cursor:pointer; font-weight:800; text-decoration:none; background:#fff; color:#495057; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border:none; }
    .btn:hover { filter:brightness(.98); }
    .pagination { display:flex; align-items:center; justify-content:center; gap:10px; margin: 16px 0; }
    .pagination a, .pagination button { padding:8px 12px; border-radius:8px; border:1px solid #dee2e6; background:#fff; cursor:pointer; }
    .pagination .current { font-weight:800; }
    .skip-link{position:absolute;left:-9999px;top:auto}
    .skip-link:focus{left:12px;top:12px;z-index:9999;background:#fff;color:#000;padding:8px 10px;border-radius:8px}
    footer{background:#fff;border-top:1px solid #e9ecef;margin-top:24px}
    .footer-wrap{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;gap:18px;flex-wrap:wrap;color:#495057}
    .footer-wrap a{color:#495057;text-decoration:none}
    .footer-wrap a:hover{color:var(--primary)}
    @media (max-width: 520px) { .thumb { height: 180px; } }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#grid">Saltar al contenido</a>
  <header>
    <div class="header-wrap">
      <a href="index.html" class="logo" aria-label="Romix">ROMIX</a>
      <nav aria-label="Secciones">
        <ul>
          <li><a id="nav-mujer" href="catalogo.html?section=mujer">Mujer</a></li>
          <li><a id="nav-hombre" href="catalogo.html?section=hombre">Hombre</a></li>
          <li><a id="nav-ninos" href="catalogo.html?section=ninos">Niños</a></li>
          <li><a href="ayuda.html">Ayuda</a></li>
        </ul>
      </nav>
      <div>
        <button class="cart-btn" type="button" aria-live="polite" aria-label="Abrir carrito">Carrito <span id="cart-count" class="cart-count">0</span></button>
      </div>
    </div>
  </header>

  <main class="container" aria-label="Catálogo de productos">
    <div class="toolbar" role="region" aria-label="Filtros">
      <input id="search" type="search" placeholder="Buscar productos" aria-label="Buscar" autocomplete="off" />
      <label for="sort" class="visually-hidden" style="position:absolute;left:-9999px;top:auto;">Ordenar</label>
      <select id="sort" aria-label="Ordenar">
        <option value="relevance">Relevancia</option>
        <option value="price-asc">Precio: menor a mayor</option>
        <option value="price-desc">Precio: mayor a menor</option>
        <option value="newest">Novedades</option>
      </select>
    </div>
    <div id="summary" class="summary" aria-live="polite">Mostrando 0 productos</div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <nav class="pagination" aria-label="Paginación">
      <button id="prev-page" type="button">Anterior</button>
      <span id="page-indicator" class="current" aria-live="polite">1</span>
      <button id="next-page" type="button">Siguiente</button>
    </nav>
  </main>
  <footer>
    <div class="footer-wrap" role="contentinfo">
      <div>
        <strong>Ayuda</strong>
        <div>
          <a href="ayuda.html#size-guide">Guía de talles</a> ·
          <a href="ayuda.html#returns">Cambios y devoluciones</a> ·
          <a href="ayuda.html">Centro de ayuda</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
