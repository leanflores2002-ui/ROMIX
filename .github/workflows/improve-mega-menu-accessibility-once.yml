name: Improve mega menu accessibility once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-mega-menu-accessibility-once.yml'

permissions:
  contents: write

jobs:
  improve-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve mega menu semantics and copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/public/assets/js/romix-header.js')
          text = path.read_text(encoding='utf-8')

          # Remove the single Mujer accessory (Cuellos). Keep the size guide.
          accessories = '''        accessories: {
          title: "Accesorios",
          links: [
            { label: "Cuellos", href: buildHref(mujer, { tipo: "accesorios", q: "cuello" }), icon: "circle" }
          ]
        },
'''
          if accessories in text:
              text = text.replace(accessories, '', 1)

          replacements = {
              'eyebrow: "Nueva coleccion",\n          title: "Entrena tu mejor version",\n          description: "Tecnologia, confort y diseno para moverte con libertad.",\n          cta: "Ver coleccion",\n          href: buildHref(mujer, { q_any: "lycra,deportivo,nuevo" }),':
              'eyebrow: "Producto destacado",\n          title: "Campera Lycra Estampada",\n          description: "Campera deportiva de lycra estampada para mujer. Comodidad y elasticidad para uso diario o entrenamiento.",\n          cta: "Ver campera",\n          href: buildHref(mujer, { q: "campera lycra estampado" }),',

              '{ label: "Joggers", href: buildHref(mujer, { tipo: "pantalones", q: "jogger" }), icon: "bottom" }':
              '{ label: "Pantalones jogger", href: buildHref(mujer, { tipo: "pantalones", q: "jogger" }), icon: "bottom" }',
              '{ label: "Babuchas", href: buildHref(mujer, { tipo: "pantalones", q: "babucha" }), icon: "bottom" }':
              '{ label: "Pantalones babucha", href: buildHref(mujer, { tipo: "pantalones", q: "babucha" }), icon: "bottom" }',
              '{ label: "Rectos", href: buildHref(mujer, { tipo: "pantalones", q: "recto" }), icon: "bottom" }':
              '{ label: "Pantalones rectos", href: buildHref(mujer, { tipo: "pantalones", q: "recto" }), icon: "bottom" }',
              '{ label: "Oxford", href: buildHref(mujer, { tipo: "calzas", q: "oxford" }), icon: "bottom" }':
              '{ label: "Calzas Oxford", href: buildHref(mujer, { tipo: "calzas", q: "oxford" }), icon: "bottom" }',
              '{ label: "Palazos", href: buildHref(mujer, { tipo: "palazos" }), icon: "bottom" }':
              '{ label: "Pantalones palazo", href: buildHref(mujer, { tipo: "palazos" }), icon: "bottom" }',

              'title: "Parte superior",': 'title: "Prendas superiores",',
              'title: "Parte inferior",': 'title: "Prendas inferiores",',
              'title: "Colecciones",': 'title: "Telas y estilos",',
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          # Give category links descriptive accessible names.
          old = '  function buildPanelColumns(columns) {\n'
          new = '  function buildPanelColumns(columns, sectionLabel) {\n'
          if old not in text:
              raise SystemExit('buildPanelColumns signature not found')
          text = text.replace(old, new, 1)

          old = '''            <a class="mega-panel-link" href="' + escapeHtml(link.href) + '" data-mega-link="true">'''
          new = '''            <a class="mega-panel-link" href="' + escapeHtml(link.href) + '" data-mega-link="true" aria-label="' + escapeHtml('Ver ' + link.label + (sectionLabel ? ' de ' + sectionLabel : '')) + '">'''
          if old not in text:
              raise SystemExit('mega panel link template not found')
          text = text.replace(old, new, 1)

          old = '    var columns = buildPanelColumns(item.columns || []);\n'
          new = '    var columns = buildPanelColumns(item.columns || [], item.label);\n'
          if old not in text:
              raise SystemExit('buildPanelColumns call not found')
          text = text.replace(old, new, 1)

          # Add a short instruction under the menu heading.
          old = '''              <span class="mega-panel-kicker">Explora ' + escapeHtml(item.label) + '</span>' +
              <a class="mega-panel-viewall"'''
          new = '''              <span class="mega-panel-heading">' +
                '<span class="mega-panel-kicker">Explora ' + escapeHtml(item.label) + '</span>' +
                '<span class="mega-panel-subtitle">Elegí una categoría para ver prendas disponibles</span>' +
              '</span>' +
              '<a class="mega-panel-viewall"'''
          if old not in text:
              raise SystemExit('mega panel heading template not found')
          text = text.replace(old, new, 1)

          # Accessible name for the visual promo card.
          old = '''            <a class="mega-promo" href="' + escapeHtml(promo.href || item.page) + '" data-mega-link="true">'''
          new = '''            <a class="mega-promo" href="' + escapeHtml(promo.href || item.page) + '" data-mega-link="true" aria-label="' + escapeHtml('Ver producto destacado: ' + (promo.title || item.label)) + '">'''
          if old not in text:
              raise SystemExit('mega promo template not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Improve mega menu visual accessibility
        shell: bash
        run: |
          cat >> frontend/public/assets/css/romix-header.css <<'CSS'

/* ROMIX mega menu: clearer categories + accessibility */
.site-header .mega-panel-heading,
header.romix-shared-header .mega-panel-heading {
  display: grid;
  gap: 3px;
}

.site-header .mega-panel-subtitle,
header.romix-shared-header .mega-panel-subtitle {
  color: #5f5960;
  font-size: 0.84rem;
  line-height: 1.4;
  letter-spacing: 0;
  text-transform: none;
  font-weight: 500;
}

.site-header .mega-panel-column,
header.romix-shared-header .mega-panel-column {
  padding: 16px;
  border: 1px solid rgba(22, 20, 24, 0.08);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.78);
}

.site-header .mega-panel-title,
header.romix-shared-header .mega-panel-title {
  margin-bottom: 12px;
  color: #17151a;
  font-size: 0.83rem;
  line-height: 1.3;
  letter-spacing: 0.065em;
  text-transform: uppercase;
}

.site-header .mega-panel-list,
header.romix-shared-header .mega-panel-list {
  gap: 5px;
}

.site-header .mega-panel-link,
header.romix-shared-header .mega-panel-link {
  width: 100%;
  min-height: 44px;
  padding: 9px 10px;
  gap: 9px;
  border-radius: 12px;
  color: #302c31 !important;
  font-weight: 650;
  line-height: 1.25;
  transition: background-color .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease;
}

.site-header .mega-panel-link:hover,
header.romix-shared-header .mega-panel-link:hover {
  background: rgba(255, 63, 134, 0.075);
  color: #d91f67 !important;
  transform: translateX(2px);
}

.site-header .mega-panel-link:focus-visible,
.site-header .mega-panel-viewall:focus-visible,
.site-header .mega-promo:focus-visible,
.site-header .mega-guide-card:focus-visible,
header.romix-shared-header .mega-panel-link:focus-visible,
header.romix-shared-header .mega-panel-viewall:focus-visible,
header.romix-shared-header .mega-promo:focus-visible,
header.romix-shared-header .mega-guide-card:focus-visible {
  outline: 3px solid #111;
  outline-offset: 3px;
  box-shadow: 0 0 0 4px rgba(255, 63, 134, 0.24);
}

.site-header .mega-link-icon,
header.romix-shared-header .mega-link-icon {
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  display: inline-grid;
  place-items: center;
  border-radius: 10px;
  background: #fff0f6;
  color: #e72e73;
}

.site-header .mega-promo-overlay,
header.romix-shared-header .mega-promo-overlay {
  background: linear-gradient(180deg, rgba(14, 12, 16, 0.08) 5%, rgba(14, 12, 16, 0.82) 100%);
}

.site-header .mega-promo-copy,
header.romix-shared-header .mega-promo-copy {
  gap: 8px;
  left: 22px;
  right: 22px;
  bottom: 22px;
}

.site-header .mega-promo-eyebrow,
header.romix-shared-header .mega-promo-eyebrow {
  color: #ffb4cf;
  font-size: 0.76rem;
}

.site-header .mega-promo-title,
header.romix-shared-header .mega-promo-title {
  font-size: clamp(1.45rem, 2.2vw, 2rem);
  max-width: 14ch;
  text-wrap: balance;
}

.site-header .mega-promo-description,
header.romix-shared-header .mega-promo-description {
  max-width: 34ch;
  color: rgba(255,255,255,.92);
  font-size: .9rem;
  line-height: 1.45;
}

.site-header .mega-promo-cta,
header.romix-shared-header .mega-promo-cta {
  min-height: 44px;
  padding-inline: 18px;
  margin-top: 2px;
}

.site-header .mega-panel-viewall,
header.romix-shared-header .mega-panel-viewall {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 63, 134, 0.25);
}

@media (min-width: 901px) {
  .site-header .mega-panel-columns,
  header.romix-shared-header .mega-panel-columns {
    gap: 12px;
  }
}

@media (max-width: 900px) {
  .site-header .mega-panel-column,
  header.romix-shared-header .mega-panel-column {
    padding: 12px;
    border-radius: 14px;
  }

  .site-header .mega-panel-link,
  header.romix-shared-header .mega-panel-link {
    min-height: 46px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .site-header .mega-panel-link,
  .site-header .mega-promo,
  header.romix-shared-header .mega-panel-link,
  header.romix-shared-header .mega-promo {
    transition: none !important;
  }
}
CSS

      - name: Validate JavaScript syntax
        run: node --check frontend/public/assets/js/romix-header.js

      - name: Validate product catalog
        run: npm run check:products

      - name: Commit improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/improve-mega-menu-accessibility-once.yml
          git add frontend/public/assets/js/romix-header.js frontend/public/assets/css/romix-header.css .github/workflows/improve-mega-menu-accessibility-once.yml
          git commit -m "feat: improve mega menu clarity and accessibility"
          git push
