name: Update media-season prices and hide winter once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-media-prices-hide-winter-once.yml'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide winter and update media-season prices only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/public/assets/data/products.json';
          const products = JSON.parse(fs.readFileSync(path, 'utf8').replace(/^\uFEFF/, ''));
          const before = JSON.parse(JSON.stringify(products));

          const normalize = value => String(value ?? '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .trim()
            .toLowerCase();

          // Exact product names from the current ROMIX catalog, mapped to the
          // Media estación price table supplied by the user.
          const prices = {
            'Calza lycra chupin': { common: 11500, special: 12000, special2: 12800 },
            'Calza lycra doble cintura': { common: 12000 },
            'Calza lycra doble cintura jaspeado': { common: 12000 },
            'Calza lycra recta': { common: 14000, special: 14500 },
            'Calza saplex jaspeado chupin': { common: 11500, special: 12000 },
            'Calza saplex jaspeado recta': { common: 14000, special: 14500 },
            'Calza oxford': { common: 13500, special: 14000 },
            'Calza oxford jaspeado saplex': { common: 13500, special: 13500 },
            'Calza lycra estampado': { common: 13000 },
            'Calza lycra arrugado': { common: 11500, special: 12000 },
            'Calza lycra combinada': { common: 13000, special: 13500 },
            'Calza algodon c/lycra chupin': { common: 12000, special: 12500, special2: 13300 },
            'Calza algodon c/lycra recta': { common: 14000, special: 14500 },
            'Calza lycra frunce levanta cola': { common: 10000 },
            'Calza gofrada lycra dama': { common: 12500, special: 13000 },
            'Calza lycra morley dama': { common: 11500, special: 12000 },
            'Calza oxford lycra morley dama': { common: 13500, special: 14000 },
            'Pantalon jogger rustico c/lycra dama': { common: 13500, special: 14300 },
            'Pantalon rustico recto dama': { common: 15000, special: 15800 },
            'Babucha modal con puño': { common: 7000, special: 7800, special2: 8300 },
            'Pantalon jogger de lycra dama': { common: 15000, special: 15800 },
            'Pantalon jogger de lycra jaspeado dama': { common: 15000, special: 15800 },
            'Pantalon modal con tira': { common: 7000, special: 7800, special2: 8300 },
            'Pantalon morley liviano dama': { common: 11000, special: 11800, special2: 12300 },
            'Top lycra liso y jaspeado dama': { common: 8500, special: 9000 },
            'Top lycra estampado dama': { common: 9000, special: 9500 },
            'Top lycra gofrada dama': { common: 8500, special: 9000 },
            'Top lycra morley dama': { common: 8500 },
            'Campera lycra': { common: 19000, special: 20000 },
            'Campera jaspeado saplex dama': { common: 19000, special: 20000 },
            'Campera modal': { common: 10500, special: 11500, special2: 12500 },
            'Campera lycra morley': { common: 18500, special: 19500 },
            'Campera rustico con lycra dama': { common: 18500, special: 19500 },
            'Remera manga larga morley viscosa': { common: 4600, special: 5100 },
            'Remera oversize algodon peinado': { common: 9000, special: 9600 },

            'Calza lycra nena': { common: 5000, special: 5500 },
            'Calza jaspeado saplex nena': { common: 5000, special: 5500 },
            'Calza algodon con lycra Niña': { common: 5000, special: 5500 },
            'Pantalon algodon rustico chico': { common: 9000, special: 9800 },
            'Remera oversize algodon peinado chico': { common: 4500, special: 5000, special2: 5000 },

            'Babucha rustico con lycra hombre': { common: 14500 },
            'Babucha lycra jogger hombre': { common: 16000, special: 16800 },
            'Pantalon rustico con cierre en bolsillos hombre': { common: 16500, special: 17300 },
            'Babucha lycra jogger jaspeado hombre': { common: 16000, special: 16800 },
            'Campera lycra hombre': { common: 19500, special: 20500 },
            'Campera rustico hombre': { common: 20500, special: 21500 },
            'Campera jaspeado saplex hombre': { common: 19500, special: 20500 }
          };

          const byName = new Map();
          products.forEach((product, index) => {
            const list = byName.get(product.name) || [];
            list.push({ product, index });
            byName.set(product.name, list);
          });

          let winterTotal = 0;
          let winterHiddenNow = 0;
          for (const product of products) {
            if (normalize(product.season) !== 'invierno') continue;
            winterTotal += 1;
            if (product.visible !== false) {
              product.visible = false;
              winterHiddenNow += 1;
            }
          }

          let updatedPrices = 0;
          for (const [name, target] of Object.entries(prices)) {
            const matches = byName.get(name) || [];
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one catalog product named "${name}", found ${matches.length}`);
            }
            const product = matches[0].product;
            if (normalize(product.season) !== 'media-estacion') {
              throw new Error(`Refusing to change non-media-estacion product: ${name} (${product.season})`);
            }

            const nextGroups = { common: target.common };
            if (Object.prototype.hasOwnProperty.call(target, 'special')) nextGroups.special = target.special;
            if (Object.prototype.hasOwnProperty.call(target, 'special2')) nextGroups.special2 = target.special2;

            const previous = JSON.stringify({ price: product.price, priceByGroup: product.priceByGroup || {} });
            product.price = target.common;
            product.priceByGroup = nextGroups;
            const current = JSON.stringify({ price: product.price, priceByGroup: product.priceByGroup });
            if (previous !== current) updatedPrices += 1;
          }

          // Guardrail: only `visible` may change on winter products, and only
          // `price` / `priceByGroup` may change on the mapped media-season products.
          const allowedMedia = new Set(Object.keys(prices));
          const changedProducts = [];
          for (let i = 0; i < products.length; i += 1) {
            const a = before[i];
            const b = products[i];
            if (JSON.stringify(a) === JSON.stringify(b)) continue;

            const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
            const changedKeys = [...keys].filter(key => JSON.stringify(a[key]) !== JSON.stringify(b[key]));
            const season = normalize(a.season);
            const allowed = season === 'invierno'
              ? new Set(['visible'])
              : (season === 'media-estacion' && allowedMedia.has(a.name)
                  ? new Set(['price', 'priceByGroup'])
                  : null);

            if (!allowed || changedKeys.some(key => !allowed.has(key))) {
              throw new Error(`Unexpected change on ${a.name}: ${changedKeys.join(', ')}`);
            }
            changedProducts.push({ name: a.name, season: a.season, changedKeys });
          }

          fs.writeFileSync(path, JSON.stringify(products, null, 2) + '\n', 'utf8');
          console.log(`Winter products found: ${winterTotal}`);
          console.log(`Winter products newly hidden: ${winterHiddenNow}`);
          console.log(`Media-season mappings verified: ${Object.keys(prices).length}`);
          console.log(`Media-season products with an actual price change: ${updatedPrices}`);
          console.log(`Total catalog records changed: ${changedProducts.length}`);
          NODE

      - name: Validate products
        run: npm run check:products

      - name: Commit catalog changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-media-prices-hide-winter-once.yml
          git add frontend/public/assets/data/products.json .github/workflows/update-media-prices-hide-winter-once.yml
          git commit -m "chore: hide winter and update media-season prices"
          git push