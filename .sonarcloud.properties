# Only deterministic HTML output is excluded from copy-paste detection.
# Sources and shared partials in frontend/src/templates remain analyzed.
# Generated HTML remains included in reliability and security analysis.
sonar.cpd.exclusions=frontend/public/index.html,frontend/public/catalogo.html,frontend/public/product.html,frontend/public/cart.html,frontend/public/ayuda.html,frontend/public/privacidad.html,frontend/public/terminos.html,frontend/public/404.html,frontend/public/mujer/index.html,frontend/public/hombre/index.html,frontend/public/ninos/index.html

# Analyze tests as tests; the generated CSS bundle duplicates the six source stylesheets.
sonar.sources=frontend,backend/app,scripts
sonar.tests=tests,backend/tests
sonar.exclusions=frontend/public/assets/css/romix-home-bundle.css
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13
