  <script>
    // Corrección global de textos mal decodificados
    (function(){
      function fixText(s){ if(!s||typeof s!=='string') return s; const m=[['CatÃ¡logo','Catálogo'],['MÃ¡s','Más'],['mÃ¡s','más'],['ColecciÃ³n','Colección'],['NiÃ±os','Niños']]; let o=s; m.forEach(([a,b])=>o=o.split(a).join(b)); return o; }
      function fixAll(){ try{ const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null); const ns=[]; while(w.nextNode()) ns.push(w.currentNode); ns.forEach(n=> n.nodeValue=fixText(n.nodeValue)); }catch{} }
      document.addEventListener('DOMContentLoaded', fixAll);
    })();

    function safeGetCart() {
      try { return JSON.parse(localStorage.getItem('cart')) || []; } catch { return []; }
    }
    function safeSetCart(value) {
      try { localStorage.setItem('cart', JSON.stringify(value)); } catch {}
    }
    let cart = safeGetCart();

    function removeFromCart(id) {
      cart = cart.filter((it) => it.id !== id);
      safeSetCart(cart);
      updateCart();
    }
    function clearCart() {
      cart = [];
      safeSetCart(cart);
      updateCart();
    }

    function findImageForItem(item){
      try {
        // Best effort: no tenemos el dataset de las cards, buscar por products.json si fuera necesario
        return '';
      } catch {}
      return '';
    }
    function changeQty(id, delta){
      cart = cart.map(it=> it.id===id ? ({...it, quantity: Math.max(1, (parseInt(it.quantity)||1)+delta), subtotal: (Math.max(1, (parseInt(it.quantity)||1)+delta))*Number(it.price||0) }) : it);
      safeSetCart(cart); updateCart();
    }
    function setQtyDirect(id, val){
      const q = Math.max(1, parseInt(val)||1);
      cart = cart.map(it=> it.id===id ? ({...it, quantity:q, subtotal:q*Number(it.price||0)}) : it);
      safeSetCart(cart); updateCart();
    }

    function updateCart(){
      const list = document.getElementById('cart-list');
      const totalEl = document.getElementById('cart-total');
      const countDisplay = document.getElementById('cart-count-display');
      list.innerHTML = '';
      let total = 0, count = 0;
      if (!cart.length) {
        list.innerHTML = '<div style="color:#6c757d">Tu carrito esta vacio.</div>';
      }
      cart.forEach((item) => {
        const img = findImageForItem(item);
        const el = document.createElement('div');
        el.className = 'cart-item';
        el.innerHTML = `
          <div class="cart-thumb">${img?`<img src="${img}" alt="${item.name}">`:'<span style="color:#adb5bd;font-weight:700;">Sin imagen</span>'}</div>
          <div class="cart-info">
            <div class="name">${item.name}</div>
            <div class="meta">${item.type} • Color: ${item.color} • Talle: ${item.size}</div>
            <div class="unit">$${Number(item.price).toLocaleString('es-AR')} c/u</div>
            <div class="qty-stepper" data-id="${item.id}">
              <button type="button" class="dec" aria-label="Disminuir">-</button>
              <input type="number" min="1" value="${item.quantity}" />
              <button type="button" class="inc" aria-label="Aumentar">+</button>
            </div>
          </div>
          <div class="cart-right">
            <div class="subtotal">$${Number(item.subtotal).toLocaleString('es-AR')}</div>
            <button type="button" class="remove" aria-label="Eliminar"><i class="fas fa-trash" aria-hidden="true"></i></button>
          </div>`;
        const id = item.id;
        el.querySelector('.dec').addEventListener('click', ()=>changeQty(id,-1));
        el.querySelector('.inc').addEventListener('click', ()=>changeQty(id,1));
        el.querySelector('input').addEventListener('input', (ev)=>setQtyDirect(id, ev.target.value));
        el.querySelector('.remove').addEventListener('click', ()=>removeFromCart(id));
        list.appendChild(el);
        total += Number(item.subtotal)||0; count += Number(item.quantity)||0;
      });
      totalEl.textContent = total.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      countDisplay.textContent = String(count);
    }

    function orderCartWhatsApp(){
      if (!cart.length) { alert('El carrito esta vacio.'); return; }
      let message = 'Hola! Quiero ordenar el siguiente pedido:\n\n';
      cart.forEach((item) => {
        message += `${item.name} (${item.type})\n`;
        message += `Color: ${item.color}\n`;
        message += `Talle: ${item.size}\n`;
        message += `Cantidad: ${item.quantity}\n`;
        message += `Subtotal: $${item.subtotal.toFixed(2)}\n\n`;
      });
      message += `Total: $${cart.reduce((t, i) => t + i.subtotal, 0).toFixed(2)}`;
      const encoded = encodeURIComponent(message);
      const phone = '5491154272065';
      const w = window.open(`https://wa.me/${phone}?text=${encoded}`, '_blank');
      if (w) w.opener = null;
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('cart-clear-btn').addEventListener('click', clearCart);
      document.getElementById('order-btn').addEventListener('click', orderCartWhatsApp);
      updateCart();
    });
  </script>
  <script src="assets/js/search.js"></script>
