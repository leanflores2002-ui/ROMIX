[build]
  command = "node scripts/generate-share-pages.js"
  publish = "frontend/public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/mujer.html"
  to = "/catalogo.html?sections=mujer"
  status = 301
  force = true

[[redirects]]
  from = "/hombre.html"
  to = "/catalogo.html?sections=hombre"
  status = 301
  force = true

[[redirects]]
  from = "/ninos.html"
  to = "/catalogo.html?sections=ninos"
  status = 301
  force = true

[[redirects]]
  from = "/novedades.html"
  to = "/catalogo.html?view=novedades"
  status = 301
  force = true

[[redirects]]
  from = "/detalle.html"
  to = "/product.html"
  status = 301
  force = true
